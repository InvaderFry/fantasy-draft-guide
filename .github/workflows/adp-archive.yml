# ADP archival program (S84).
#
# The only item in the spec whose value expires. Intra-summer ADP movement is
# not purchasable retroactively: whatever is not captured this summer is gone.
# This runs on a GitHub runner rather than a laptop so a capture does not
# depend on anyone being awake, and it commits each dated snapshot back to the
# repo, where the immutability rule (S84 `never: overwrite`) is enforced by
# pipeline/snapshot.py.

name: ADP archive

on:
  schedule:
    # 11:00 UTC daily. FFC updates once per day; a fixed hour keeps the
    # intra-summer series evenly spaced, which S31.3 (recency weighting) needs.
    - cron: "0 11 * * *"
    # A second pass, because `snapshot` no longer writes a payload whose window
    # closed before the capture date -- on a day FFC publishes later than usual
    # the 11:00 run correctly declines to file yesterday's numbers as today's,
    # and something has to come back for the real ones. A run with the day
    # already in hand reports that and exits 0, so this costs nothing.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season the capture describes (default: current year)"
        required: false
        type: string
      sources:
        # A dated capture is immutable (S84). Re-running a source that has
        # already landed today is reported and skipped rather than failed, so
        # the default list is safe to dispatch at any hour; narrow it only to
        # retry one source without waiting on the others.
        description: "Comma list of sources to capture (default: ffc,projections)"
        required: false
        default: "ffc,projections"
        type: string

permissions:
  contents: write

# A capture is dated. Two runs racing the same date would have one of them fail
# the overwrite guard and report a false alarm.
concurrency:
  group: adp-archive
  cancel-in-progress: false

jobs:
  # The season guard. S84's captures are worth taking in the run-up to a draft
  # and worth nothing after it: FFC freezes, the board nobody will read again is
  # re-rendered anyway, and the fit gate re-measures it every morning. So the
  # jobs below sleep from Week 1 until mid-July, and `research season-window`
  # (pipeline/preseason.py `dormant`) is the single place that decides it -- the
  # same predicate `archive-status` reads, so the alarm and the schedule cannot
  # drift into describing different windows.
  #
  # A gate job rather than a step in each: `capture` must not start at all on a
  # dormant morning, and GitHub cannot evaluate a Python predicate in an `if`.
  window:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync

      - name: Decide whether today is inside the capture window
        id: check
        # Exits 0 either way. A dormant day is the system working, and a red run
        # every morning of the off-season teaches people to stop reading them.
        run: uv run research season-window

      # Dormancy cannot be silent. GitHub disables cron workflows in a repository
      # with no activity for 60 days and the off-season is ten months, so the
      # schedules that are supposed to wake in July would already be off -- the
      # guard would have killed the thing it guards. One commit a month keeps
      # them alive on exactly the mechanism the archive has always relied on, and
      # leaves a record of why nothing else ran.
      #
      # This workflow owns the heartbeat alone. Three workflows committing to
      # main on the same morning is the rebase loop `sleeper` is sequenced to
      # avoid.
      - name: File the dormancy heartbeat
        if: steps.check.outputs.heartbeat == 'true'
        run: |
          # The date is what makes this a heartbeat: the reason line alone is
          # identical all winter, so there would be nothing to commit.
          {
            date -u +%Y-%m-%d
            uv run research season-window
          } > artifacts/dormancy.txt
          # Both crons fire on the 1st. The second one writes the same date, so
          # without this `git commit` exits non-zero on an empty index and reds
          # a run whose only job that morning was to prove the schedule is alive.
          if [ -z "$(git status --porcelain artifacts/dormancy.txt)" ]; then
            echo "heartbeat already filed today - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/dormancy.txt
          git commit -m "Dormant: $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** attempt))
          done
          exit 1

  capture:
    needs: window
    # A manual dispatch always bypasses the guard: retrying a capture in February
    # has to keep working, and the guard is about what the schedule does
    # unattended, not about what a person may ask for.
    if: needs.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # main, explicitly: the archive has to land on the default branch whatever
      # ref a manual dispatch was launched from. This previously pinned a feature
      # branch, which was then merged, so every capture would have gone to a
      # branch nothing reads.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync

      - name: Capture ADP and projection snapshots
        # Non-zero exit on an empty capture is deliberate: a silent no-op day
        # looks like success and costs a day of price movement. What counts as
        # empty is decided in `snapshot_`, not here -- a payload the source has
        # not republished, and a date already captured, are days in hand rather
        # than days lost, and exit 0.
        #
        # The `projections` source falls back API -> manual CSV -> skip (S11), so
        # an absent FANTASYPROS_API_KEY reports itself and leaves the ADP
        # capture -- the part whose value expires -- unaffected.
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          uv run research snapshot \
            --sources "${{ inputs.sources || 'ffc,projections' }}" \
            ${{ inputs.season && format('--season {0}', inputs.season) || '' }}

      - name: Verify hashes
        run: uv run research validate

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain data/snapshots)" ]; then
            # Not a guard any more: the capture step distinguishes a lost day from
            # a day already in hand and exits non-zero for the first, which fails
            # this job before it reaches here. A clean tree at this point means it
            # said so and was right.
            echo "nothing new to commit - the capture step reported why and exited 0"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git commit -m "ADP archive: $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** attempt))
          done
          exit 1

  # S38.1's second provider, in its own job for one reason: a Sleeper failure
  # must not be able to cost a day of ADP. That is S84's single unrecoverable
  # failure, and it is exactly what would happen if this were another step in
  # `capture` -- an adapter raising there aborts the job before the FFC payloads
  # are committed, and the day is gone.
  #
  # `needs: capture` rather than a parallel job, because both commit to
  # data/snapshots on main and two pushes racing the same file is a rebase loop.
  # `continue-on-error` so a Sleeper outage leaves the run green and the sheets
  # job still rendering: the board is still complete without a second provider,
  # it simply carries no error bar, which is the state it was in until now.
  #
  # No alarm attached, deliberately. A Sleeper series that stops reports itself:
  # S38.1 suppresses agreement once the shared capture falls more than
  # MAX_VINTAGE_GAP_DAYS behind the board, and the sheet prints "agreement not
  # shown" in its own legend. A failure that is visible on the deliverable does
  # not need a second channel.
  sleeper:
    needs: [window, capture]
    if: needs.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the snapshot the capture job just pushed

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync

      # Daily, though S38.1 only needs weekly: MAX_VINTAGE_GAP_DAYS is 7, and a
      # daily series means the day both providers share is almost always today,
      # so `tiers.second_opinion` pins the comparison to a real shared capture
      # rather than reaching back for one. No key: Sleeper is unauthenticated.
      - name: Capture Sleeper projections
        run: |
          uv run research snapshot --sources sleeper \
            ${{ inputs.season && format('--season {0}', inputs.season) || '' }}

      - name: Verify hashes
        run: uv run research validate

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain data/snapshots)" ]; then
            echo "nothing new to commit - the capture step reported why and exited 0"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git commit -m "Sleeper projections: $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** attempt))
          done
          exit 1

  # The capture is only half the job. S84 archives the price; nothing rebuilt
  # anything downstream of it, so the S83 sheets stayed frozen at whatever board
  # they were last generated from -- and with the draft dates unknown there is no
  # date on which somebody would think to re-run them by hand.
  #
  # Separate job, not extra steps above, and deliberately so: an uncaptured day
  # of ADP movement is gone permanently (S84) while a sheet can always be
  # re-rendered. The two must not share a failure. By the time this runs the
  # capture has already committed and pushed.
  sheets:
    # Both, so the re-rendered board carries the second provider. `sleeper` is
    # continue-on-error, so its failure resolves as success here and this job
    # still runs -- which is the intent: a board with no error bar beats no board.
    needs: [window, capture, sleeper]
    if: needs.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Job-level, which REPLACES the workflow-level grant rather than adding to
    # it, so `contents` has to be named again here. `issues` is for the
    # sheet-overflow alarm at the end of this job.
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # fetches the snapshot the capture job just pushed

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync

      # Only what the market-dependent modules need. S12's crosswalk wants
      # players.parquet plus recent rosters for the platform IDs -- about 7 MB.
      # The full 2012-2025 play-by-play pull is ~300 MB and feeds S25 and S21.1,
      # which describe completed seasons and would recompute an identical answer
      # every morning; their artifacts are committed and carried forward instead.
      - name: Build the crosswalk and the market tables
        run: |
          uv run research ingest --datasets players,rosters --seasons 2024-2025
          uv run research normalize-ids
          uv run research build-tables --tables adp_history,projection_snapshot

      # A fixed edition, regenerated in place. The dated editions are the
      # archival scheme (S9, S78); this is the one live board, and it keeps a
      # stable address because the thing that opens it on draft day is a
      # bookmark on a phone.
      - name: Refresh the draft board
        run: |
          uv run research run-research \
            --edition 2026-draft \
            --modules tiers_and_replacement_level,survival_probability
          uv run research sheet --edition 2026-draft

      # Between the render and the commit, and that ordering IS the mechanism: a
      # failed step skips the commit, so a degraded board never reaches the
      # branch. `run-research` exits 0 on a blocked module by design -- for a
      # dated edition a shut gate is a finding -- which is exactly how 26 sheets
      # reading BLOCKED could otherwise be committed over good ones at 11:00 UTC
      # with nothing going red. When this fails, yesterday's sheets stand, and
      # they already say on their own face that they are not today's (S83).
      - name: Refuse to publish a degraded board
        run: uv run research refresh-check --edition 2026-draft

      - name: Commit the refreshed sheets
        run: |
          if [ -z "$(git status --porcelain artifacts/2026-draft)" ]; then
            echo "sheets unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/2026-draft
          git commit -m "Draft sheets: $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** attempt))
          done
          exit 1

      # The measurement is only a bound if the fonts are the wide ones. The
      # sheet asks for `-apple-system, "Segoe UI", Helvetica, Arial, sans-serif`;
      # here the first three do not exist and Arial resolves to Liberation Sans,
      # which is metric-compatible with Arial and wider than SF Pro or Segoe UI.
      # So a page that fits on this runner fits on the machine that prints it.
      # `fit-check` reports what Arial actually resolved to, so an image that
      # stops shipping this package loosens the bound visibly rather than
      # silently.
      - name: Install the fonts the measurement is taken with
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-liberation

      # AFTER the commit, and the difference from `refresh-check` is the whole
      # reasoning. That one withholds the board, because a BLOCKED sheet is
      # unusable and stale-but-complete beats fresh-but-blocked. This is the
      # opposite trade: a two-page sheet still carries every number and only its
      # second page is easy to miss, so fresh-but-two-page beats
      # stale-but-one-page and today's board lands either way. Same placement,
      # and for the same reason, as `preseason-status` in the bundle workflow:
      # last, and the step allowed to fail.
      #
      # The browser is whatever the runner image ships -- `fit-check` looks for
      # $CHROME_BIN and then chromium/google-chrome on PATH, and says which it
      # measured with. If an image ever ships none, it reds naming what it looked
      # for, which is the right failure: an unmeasured page is not a page that fits.
      - name: Check the board still prints on one page
        id: fit
        run: |
          uv run research fit-check --edition 2026-draft 2>&1 | tee fit.txt
          exit "${PIPESTATUS[0]}"

      # A red run in a repository nobody is watching is not an alarm. The same
      # recipe archive-monitor.yml uses for a stalled archive, with its own label
      # so the two never collapse into one thread.
      - name: Open or update the overflow issue
        if: failure() && steps.fit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "The S83 draft sheets no longer print on one page, as of $(date -u +%Y-%m-%d). Today's board is committed and is still the freshest one there is -- a two-page sheet carries every number -- but a section that slid onto a second page is a section nobody reads at a table with a pick clock." \
            "$(tail -c 4000 fit.txt 2>/dev/null || echo 'no output captured')" \
            "Run: $RUN_URL")"
          gh label create sheet-overflow \
            --description "The S83 draft sheet no longer fits on one page" \
            --color D93F0B 2>/dev/null || true
          existing="$(gh issue list --label sheet-overflow --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label sheet-overflow \
              --title "Draft sheet no longer fits on one page" --body "$body"
          fi
