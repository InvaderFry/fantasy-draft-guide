# League scoring profiles (S14).
#
# Never hard-code one scoring system into the raw data. Every downstream
# conclusion is conditional on scoring and roster structure.
#
# RULE: research runs ONLY for profiles marked `real: true`. Generic profiles
# are for illustration and are excluded from Targets, Avoids, and the
# draft-day sheet (S83). `pipeline.config.require_real_profiles()` raises until
# at least one is real.
#
# One profile per league, not one per scoring system. Replacement level is
# teams x starters at each position, so two leagues with identical scoring and
# different team counts have different tier breaks; and draft date and slot are
# per-league inputs to survival probability (S31.2) and the simulator (S36.2).
# S83 generates the draft-day sheet per profile for exactly this reason.
#
# The two below are the leagues actually being drafted, and both are real.
#
# `draft_date` and `draft_slot` are both `unknown`, which is a stated answer and
# not an unfinished one. The dates have not been set, and the draft position is
# drawn roughly an hour before the draft starts -- so a gate that waited for
# either would still be shut on draft morning, and the sheet this whole build
# exists to produce would never be generated.
#
# What each unknown costs:
#
#   draft_date   Nothing today. No code reads it. The sheet prices off the most
#                recent archived ADP capture (S84), which is the correct rule
#                when the draft is imminent and the only one available when the
#                date is unknown. S36.2's simulator will want a real date.
#
#   draft_slot   S31.2 computes survival for every slot rather than guessing one,
#                and S83 pre-renders a draft-day sheet per slot. When the order
#                is drawn you open the sheet for your seat; nothing is rebuilt,
#                nothing needs a network, and the tier board never depended on
#                the slot in the first place.
#
# `unknown` is accepted; the literal string TODO is not. `pipeline.config.
# validate_profile()` raises on it, because a placeholder that flows through as
# "undrawn" produces a plausible output from a question nobody answered.
#
# Both formats are covered by `adp_capture` below, so their price history is
# being archived daily already (S84).

active_profiles:
  - id: half_ppr_12
    real: true
    label: "12-team half-PPR, 1QB"
    teams: 12
    draft_date: unknown         # not set; S36.2 will want it, nothing today does
    draft_slot: unknown         # drawn an hour before the draft -- see above
    scoring:
      pass_td: 4
      pass_yd: 0.04
      interception: -2
      fumble_lost: -2
      rush_yd: 0.10
      rush_td: 6
      reception: 0.5
      receiving_yd: 0.10
      receiving_td: 6
      two_point_conversion: 2
      special_teams_td: 6
    starters:
      QB: 1
      RB: 2
      WR: 3
      TE: 1
      FLEX: 1
    flex_eligible: [RB, WR, TE]
    bench: 6

  # Same roster shape as above; the reception value is the only difference, and
  # it is enough to reorder receivers against backs. Kept as a separate profile
  # rather than a scoring variant of one, because the draft date and slot will
  # differ once both are drawn, and those drive which picks are actually held.
  - id: ppr_12
    real: true
    label: "12-team full PPR, 1QB"
    teams: 12
    draft_date: unknown
    draft_slot: unknown
    scoring:
      pass_td: 4
      pass_yd: 0.04
      interception: -2
      fumble_lost: -2
      rush_yd: 0.10
      rush_td: 6
      reception: 1.0
      receiving_yd: 0.10
      receiving_td: 6
      two_point_conversion: 2
      special_teams_td: 6
    starters:
      QB: 1
      RB: 2
      WR: 3
      TE: 1
      FLEX: 1
    flex_eligible: [RB, WR, TE]
    bench: 6

# ADP capture formats (S84). Deliberately a SUPERSET of the profiles above:
# the archival job's value expires daily, so it captures every plausible
# format now rather than waiting for the real profiles to be encoded.
# Narrow this if the request volume ever matters; a test asserts the list still
# covers every profile's derived format, real or not (S14, S84).
adp_capture:
  - {format: standard, teams: 12}
  - {format: half-ppr, teams: 12}
  - {format: ppr, teams: 12}
  - {format: half-ppr, teams: 10}
  - {format: ppr, teams: 10}
  - {format: 2qb, teams: 12}
