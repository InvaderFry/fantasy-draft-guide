# Source / license registry (S46).
# Technical registry, not legal advice. Review current source terms before
# any public or commercial distribution.

sources:
  nflverse:
    url: https://github.com/nflverse/nflverse-data
    docs: https://nflreadpy.nflverse.com/
    asset_base: https://github.com/nflverse/nflverse-data/releases/download
    purpose:
      - player_week
      - player_season
      - team_season
      - rosters
      - snap_counts
      - depth_charts
      - injuries
      - draft_picks
      - player_id_crosswalk
    license: CC-BY-4.0
    attribution_required: true
    attribution: "Data from nflverse (nflverse-data), CC-BY-4.0."
    notes: >
      Component datasets carry their own terms. Participation data 2023+ comes
      from FTN Data and carries CC-BY-SA attribution requirements -- it is NOT
      ingested in this chunk. Full routes-run history is NOT available here;
      use target share / snap share / air-yard share instead (S10A).

  nfldata_schedules:
    url: https://github.com/nflverse/nfldata
    asset: https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv
    purpose:
      - schedules
      - bye_weeks
    license: CC-BY-4.0
    attribution_required: true

  fantasy_football_calculator:
    url: https://help.fantasyfootballcalculator.com/article/42-adp-rest-api
    api_base: https://fantasyfootballcalculator.com/api/v1/adp
    purpose:
      - historical_adp
      - current_adp
      - intra_summer_adp_archive
    license: free_personal_and_commercial_with_attribution
    attribution_required: true
    attribution: "ADP data courtesy of Fantasy Football Calculator."
    update_frequency: daily
    notes: >
      ADP represents the FFC mock-draft population, not the whole market.
      UNRESOLVED (S31.1): whether the response exposes a pick distribution
      (stdev / percentiles / n_drafts) or only a mean. The archival job stores
      the raw payload unmodified so this is answered from data, not guesswork.
      NOT REACHABLE from the Claude Code sandbox (403 at CONNECT) -- the
      capture runs on a GitHub Actions runner.

  projection_csv:
    url: manual
    purpose:
      - current_season_projections
    license: provider_specific
    attribution_required: true
    notes: >
      S11 option 1B manual-import fallback. Drop a provider export in
      data/raw/projections/ and declare its column mapping under
      `projection_providers` below. One row per provider per player -- never
      average providers, cross-provider dispersion is the only available proxy
      for projection uncertainty (S38.1).

  sleeper:
    url: https://docs.sleeper.com/
    purpose:
      - optional_raw_draft_picks
    commercial_use: contact_provider
    status: deferred
    notes: >
      S10D. Corpus-acquisition problem unsolved and permitted-access path
      undefined. Also blocked from the sandbox. Not ingested.

  fantasypros_api:
    url: https://www.fantasypros.com/api-data/
    docs: https://support.fantasypros.com/hc/en-us/articles/49749297704475
    api_base: https://api.fantasypros.com/public/v2/json
    endpoint_family: public_v2
    purpose:
      - projections
      - expert_consensus_rankings
    license: provider_specific
    attribution_required: true
    status: key_required        # adapter built; no FANTASYPROS_API_KEY configured yet
    notes: >
      S11 option 1, the preferred projection path. The key is read from
      FANTASYPROS_API_KEY on every fetch, travels in a header, and is never
      written into a snapshot URL or manifest -- this repository is public and a
      key in a manifest is a key in the git history. No key means a skip, not a
      failure: unlike ADP (S84), a projection missed today is fetchable
      tomorrow. Fallback is projection_csv below.

      EVERYTHING BELOW IS UNVERIFIED. api.fantasypros.com answers 403 at CONNECT
      from the development sandbox, so this adapter could not be written against
      an observed payload the way fantasy_football_calculator was. The path,
      envelope and column names are configuration precisely so the first
      successful runner call corrects them here rather than in Python. The
      adapter persists the raw payload unmodified and records the row keys it
      actually saw; see `fantasypros_projection_shape` in research/questions.yaml.

    # {season} and {position} are substituted by the adapter.
    projections_path: "nfl/{season}/projections"
    positions: [QB, RB, WR, TE]
    key_header: x-api-key
    params:
      week: 0                   # 0 = full-season / draft projections
    container_key: players      # where the row list lives in the response
    id_col: fpid
    name_col: name
    team_col: team_id
    position_col: position_id
    # Provider column -> the repository's stat names. Deliberately player_week's
    # spelling rather than S11's, so pipeline/scoring.py scores a projection with
    # the same code and the same league profile it scores a real season with.
    stat_map:
      pass_att: pass_attempts
      pass_cmp: pass_completions
      pass_yds: passing_yards
      pass_tds: passing_tds
      pass_ints: interceptions
      rush_att: carries
      rush_yds: rushing_yards
      rush_tds: rushing_tds
      rec_tgt: targets
      rec: receptions
      rec_yds: receiving_yards
      rec_tds: receiving_tds
      # S11's canonical schema calls these `fantasy_points` and `games`. Both
      # names are already taken by OUTCOME_COLUMNS, where they mean what a player
      # actually scored and actually played. A projection column sharing a name
      # with an outcome column is the bug this repo already shipped once with
      # target_share, so the projection side is prefixed.
      fpts: projected_fantasy_points
      games: projected_games

# Column mappings for manual projection imports (S11 option 1B).
# Add one block per provider export you actually drop in data/raw/projections/.
projection_providers: {}
