# Research question registry (S68).
#
# A question is not researched until every field below is filled in. Two gates
# are load-bearing:
#   - decision-value gate (S2.3): if `decision_change` cannot be written in one
#     concrete sentence, the question is not built, no matter how interesting.
#   - power gate (S5.1): if mde_pp > plausible_effect_pp, mark UNANSWERABLE and
#     do not build the chapter.
# Every question carries a `kill_rule`. Without one an underpowered chapter
# absorbs unbounded time and then gets graded C rather than abandoned.
#
# STATUS OF THIS FILE: seeded with the three S88 Week 2 analyses only, plus the
# S31.1 source question that must be resolved in Week 1. The full registry and
# the feasibility pass belong to the September-February build (S79 Step 0).
# Power fields read TBD because the feasibility pass has not run; under S88
# these three are DESCRIPTIVE ONLY and carry no evidence grade.

questions:
  - id: ffc_pick_distribution_available
    question: >
      Does the Fantasy Football Calculator ADP API expose an underlying pick
      distribution (stdev, percentiles, n_drafts), or only a mean ADP per
      player per snapshot? And is historical ADP retrievable as intra-summer
      snapshots or only a single end-of-preseason value per season?
    type: source_resolution           # not a statistical question
    blocks:
      - S19.4 opportunity cost
      - S31.1 ADP uncertainty
      - S31.2 survival probability
      - S31.3 recency-weighted ADP
      - S36.2 draft simulator
      - S83 draft-day sheet
    decision_change: >
      Whether survival probability at each held pick is computed empirically
      from the distribution or from the labelled normal approximation (S19.4).
    resolution_method: >
      Inspect the raw archived payload from the first adp-archive workflow run:
      data/snapshots/<date>/ffc_adp_*.json. The adapter records which
      distribution fields were present in the snapshot manifest notes.
    status: RESOLVED
    resolved_on: 2026-08-13
    answer: >
      A mean and a spread, no percentiles. Every payload carries per player:
      adp, stdev, high, low and times_drafted. There are no pick percentiles
      and no per-pick histogram, so P(player available at pick N) cannot be
      computed empirically. S19.4's labelled fallback applies --
      P_available = 1 - Phi((next_pick - adp) / stdev) -- and every page built
      on it must show that it is an approximation and record
      opportunity_cost_method: normal_approximation in its S16 artifact.
    answer_evidence: >
      data/snapshots/2026-08-13/, 18 payloads across 6 formats and 3 seasons.
      adp_history.distribution_availability() reports the fields per capture.
    historical_availability: >
      The year parameter works, but not back to 2007 as S10B states. 2025, 2020
      and 2026 return all six configured formats; 2015 returns an empty player
      list for half-ppr/12team. The usable window is bounded below somewhere
      between 2015 and 2020 and is being bracketed.
    intra_summer_history: >
      Not retrievable. A historical season returns a single final-preseason
      window -- 2025 comes back as 2025-08-25..2025-09-01, 2020 as
      2020-08-30..2020-09-01 -- not a series across the summer. S31.3 recency
      weighting is therefore only possible for seasons captured live, starting
      with 2026.
    window_semantics: >
      An ADP figure is a rolling average, not a daily value, and the window
      length varies with format volume: on 2026-08-13, ppr/12team covered 7
      days and 3,577-draft 2qb/12team covered 30. adp_history carries
      window_start, window_end and total_drafts so a weighting scheme can see
      how stale a figure is.
    archive_gap: >
      The adp-archive workflow shipped pinned to a feature branch that was
      subsequently merged. Its first successful capture is 2026-08-13; there is
      no live capture before that date and those days of intra-summer price
      movement are not purchasable retroactively (S84).

      One further day is missing INSIDE the series: 2026-08-14. A dispatch at
      00:08 UTC captured FFC before it had published and filed the 08-13 window
      under 08-14; the 11:43 run fetched the real payload and was rejected by the
      overwrite guard, correctly and too late. `cli._classify` now refuses a
      payload whose window closed before the capture date, so the defect cannot
      recur -- but the day itself is gone. `research archive-status` reports it
      on every run, and reports it as a fact: a hole is permanent, and only a
      STALLED archive fails, because only a stall can still be fixed.

  - id: nflverse_preseason_injuries_published
    question: >
      Does nflverse publish injury designations for a season before that
      season's Week 1, or does injuries_{season}.parquet only begin once the
      regular season does? S84's preseason bundle names "preseason injury
      designations" as one of the four things to capture before Week 1, and a
      thing that is never published cannot be captured.
    type: source_resolution           # not a statistical question
    blocks:
      - S15.1 availability decomposition
      - S84 preseason bundle
      - S86 role signals knowable at the decision date
    decision_change: >
      Whether an injury designation carried into the draft is a feature the
      2027 build can use at the 2026 decision date, or whether the earliest
      designation any season has is dated after every draft -- in which case
      S15.1 availability has no preseason input at all and must say so rather
      than quietly starting from Week 1.
    resolution_method: >
      The preseason-bundle workflow requests injuries_{season} on every capture
      day between the decision date and Week 1. A 404 is recorded by name in the
      run log; a payload lands in data/snapshots/<date>/ and its earliest
      designation date answers the question from data. Both are answers, and the
      capture is written not to treat the first as a failure.
    status: OPEN
    evidence_so_far: >
      2026-08-15: injuries_2026.parquet 404s at the release asset URL while
      depth_charts_2026, roster_2026 and roster_weekly_2026 all serve. That is
      consistent with the file being created when the season's first injury
      report is filed, but one date two weeks before Week 1 does not distinguish
      "not yet" from "not ever", which is why the capture keeps asking.
    kill_rule: >
      If no injuries file exists for the season by the day before Week 1, the
      question is answered NO for 2026: record it, and let S15.1 state that
      preseason injury designations are unavailable rather than modelling
      around an absence nobody wrote down.

  - id: team_scoring_regression
    question: >
      Do team touchdown totals regress toward a yardage/opportunity-implied
      expectation from one season to the next, and by how much?
    spec_section: S25
    primary_outcome: next_season_offensive_tds
    secondary_outcomes: []
    family_size_expected: 1
    decision_change: >
      Fade the pass catchers and backs of teams whose prior-season TD total
      badly exceeded their yardage-implied expectation; prefer the players on
      teams below it, at equal ADP.
    decision_frequency_est: 3.0       # picks per draft
    decision_magnitude_est: 1.2       # points per affected pick
    decision_value: HIGH
    n_analysis_est: 448               # team-seasons 2012-2025
    n_holdout_est: 128
    plausible_effect_pp: TBD
    mde_pp: TBD
    power_status: EXPECTED_ANSWERABLE # best sample-to-effect ratio in the spec
    effort_hours_est: 6
    kill_rule: >
      Stop if the prior-season TD residual explains under 2% of next-season
      variance with the full 448 team-seasons.
    kill_rule_outcome: >
      TRIGGERED on 2026-08-13. 416 consecutive-season pairs. The opportunity
      model explains 78% of offensive TDs, but its residual explains 0.29% of
      next-season TD totals and 0.23% of next season's residual -- touchdown
      overperformance does not persist at all.
      The same data shows strong regression to the mean, which is what
      decision_change actually turns on: Spearman -0.52 between a team's
      offensive-TD z-score and its next-season change; teams at z >= +2 lost
      17.7 TDs (n=10, all ten moved toward the mean), z +1..+2 lost 5.9, and
      z -2..-1 gained 8.4. All nine S25 metrics regress, Spearman -0.50..-0.62.
      Reading these together: the kill rule as written measures whether last
      year's luck predicts next year's TOTAL, which is dominated by next year's
      opportunity. It is arguably the wrong quantity for the decision. Changing
      it now would be post-hoc, which S80 prohibits, so it is recorded as
      triggered and the amendment is left as a decision requiring a new
      methodology_version and a stated reason (S3.1, S26).
    status: completed_week2
    completed_on: 2026-08-13
    artifact: artifacts/2026.08.13-r1/methods/team_scoring_regression.json
    claim_type_permitted: DESCRIPTIVE   # S88: no prescriptive claim from a two-week analysis
    first_edition: null

  - id: rb_dead_zone_bucket_rates
    question: >
      What were the observed high-end hit rates for running backs by ADP
      bucket, and is there an ADP band where the rate falls below the rate for
      wide receivers priced alongside them?
    spec_section: S21.1
    primary_outcome: rb_high_end
    secondary_outcomes: []
    family_size_expected: 1
    decision_change: >
      Whether to take the RB or the WR at picks inside the flagged band, when
      both are on the board at similar ADP.
    decision_frequency_est: 2.0
    decision_magnitude_est: 1.0
    decision_value: HIGH
    n_analysis_est: 175               # RB, ADP 37-72, 2012-2025 (S5.1 estimate)
    n_holdout_est: 52
    plausible_effect_pp: TBD
    mde_pp: TBD
    power_status: LOW_POWER           # detects only large effects (S5.1)
    effort_hours_est: 5
    kill_rule: >
      Observed rates by bucket only. No modelling, no evidence grade, no
      exception research -- the sample will not support it in this window (S88).
    kill_rule_outcome: >
      HONOURED. Observed rates only: no dead_zone_score, no robustness sweep,
      no exception research, no grade.
    n_analysis_actual: 93
    n_analysis_note: >
      93 RB seasons in the 37-72 band, against the 175 S5.1 estimated. The
      shortfall is not a filtering mistake: Fantasy Football Calculator serves
      historical ADP only from 2018, not from 2007 as S10B states, so the window
      is 8 seasons rather than 14. Every bucket is correspondingly smaller than
      the power note assumed.
    finding: >
      DESCRIPTIVE. Half-PPR 12-team, 2018-2025, 1,285 drafted player-seasons.
      RB high-end (top-12) hit rate by ADP bucket against the WRs priced
      alongside them: picks 1-12 RB 0.63 / WR 0.81; 13-24 0.51 / 0.61; 25-36
      0.23 / 0.40; 37-48 0.12 / 0.42; 49-60 0.09 / 0.23; 61-72 0.15 / 0.22.
      The widest gap is picks 37-48, where the RB rate is 30.5 points lower and
      the risk ratio is 0.28. The zone the spec hypothesised at ADP 37-72 shows
      up in the observed rates, and it opens earlier than that -- from about
      pick 25. No prescriptive claim is made from this (S2.2, S88).
    status: completed_week2
    completed_on: 2026-08-13
    artifact: artifacts/2026.08.13-r1/methods/rb_dead_zone_bucket_rates.json
    claim_type_permitted: DESCRIPTIVE
    first_edition: null

  - id: tiers_and_replacement_level
    question: >
      Where do the tier breaks fall on the current board, and what is value
      over replacement by position for the real league profiles?
    spec_section: S19.3, S19.4
    primary_outcome: null             # construction, not a hypothesis test
    decision_change: >
      Which position to take at each held pick, by comparing the drop to the
      next tier at every position rather than raw projected points.
    decision_frequency_est: 16.0      # every pick in the draft
    decision_magnitude_est: 0.8
    decision_value: HIGH
    power_status: NOT_APPLICABLE
    effort_hours_est: 8
    kill_rule: >
      Blocked, not killed, if no league profile is marked real: true --
      replacement level is undefined without teams and starter counts (S14).
    kill_rule_outcome: >
      BLOCKED, and by two things rather than one. No profile is marked
      real: true, and there is no projection source at all -- S19.3's tier
      metric is projected_points - replacement_points and
      config/sources.yaml has an empty projection_providers map with the
      FantasyPros API deferred. Encoding a league profile alone will not
      unblock it. research/foundations/tiers.py reports both and refuses to run.
    kill_rule_outcome_2026_08_13b: >
      UNBLOCKED, and it ran. Both gates opened on the same day.
      The profile gate opened by answering the question rather than by waiting
      for it: `draft_date` and `draft_slot` are both `unknown` in
      config/league_profiles.yaml and both profiles are now real: true. Neither
      value was going to arrive in time -- the dates are unset and the draft
      order is drawn about an hour before the draft -- so a gate that waited for
      them would have been shut on draft morning. Nothing reads draft_date today;
      an undrawn slot is answered by S31.2 reporting every slot and S83 rendering
      a sheet per slot.
      The projection gate opened because FANTASYPROS_API_KEY turned out to be
      configured as a repository secret and had simply never been exercised: every
      archive run to that point predated the adapter. One dispatch captured four
      payloads (QB/RB/WR/TE, 2026). See fantasypros_projection_shape for what the
      payload actually looked like.
      Result: tier boards for both profiles on n=486 projected players, and
      survival for all 12 slots of both (n=1,724 half-PPR, n=1,880 PPR). The S83
      sheet now carries TIERS and SURVIVAL as content rather than as BLOCKED
      notices, 26 sheets in all, each verified to print on one page.
      A second defect surfaced on the way: blockers() asked
      projection_source_available(), which reports whether THIS MACHINE could
      fetch projections. That is a different question from whether projections
      exist, and it made the blocker permanent on every machine without the API
      key -- including every rebuild from the committed archive, which is the
      reason the archive is committed. It now asks whether a capture has landed.
    kill_rule_outcome_2026_08_14: >
      STILL BLOCKED, and by the same two things -- but the machinery below them
      is now built and tested, so clearing the gates is the whole remaining
      change rather than the start of one.
      research/foundations/tiers.py implements S19.3's metric
      (projected_points - replacement_points), S19.4's per-profile replacement
      level including flex allocation, and adjacent-gap tier breaks at a
      multiple committed in code. research/foundations/survival.py implements
      S31.2 on S19.4's labelled normal approximation. research/sheet.py renders
      the S83 sheet from the artifacts. All three run against fixtures in the
      test suite; none can run on real data yet.
      A defect was fixed in the process: blockers() read projection_providers
      off config.sources(), which returns the `sources:` sub-map, while the key
      is a top-level sibling of it. The projection blocker was therefore
      unclearable -- it would have kept firing after someone did exactly what it
      asked. config.projection_providers() is now the single accessor and a test
      reproduces the old behaviour.
    remaining_to_unblock_resolved_2026_08_13: >
      (1) config/league_profiles.yaml: draft_date and draft_slot on either
      profile, then real: true. draft_slot may be `unknown`; survival then
      reports every slot instead of one. (2) A projection source: either
      FANTASYPROS_API_KEY as a repository secret (S11 option 1, adapter built
      and wired into the archive workflow) or a manual export declared under
      projection_providers (S11 option 1B).
    status: completed_week3
    claim_type_permitted: DESCRIPTIVE
    first_edition: null

  - id: adp_price_movement
    question: >
      How has each player's price moved across the intra-summer archive, and
      does recency weighting predict the next draft better than the published
      mean (S31.3)?
    type: descriptive_construction
    blocks:
      - S83 draft-day sheet (the price shown at a live pick)
      - S31.3 recency-weighted ADP
      - S36.2 draft simulator
    decision_change: >
      Whether a drafter reads the printed price as current or as stale. A player
      whose ADP has moved half a round since the last capture will not be
      available where the sheet says he will, and the drafter either waits a
      round too long or reaches a round too early.
    resolution_method: >
      The descriptive half is computed from adp_history across every archived
      capture: the delta between the newest capture and the one a lookback
      earlier, joined on Fantasy Football Calculator's own player id.
      research/foundations/price_movement.py.
    power_status: NOT_APPLICABLE   # a construction from the archive, not a test
    status: partially_answered
    answered: >
      DESCRIPTIVE only. The movement is measured and displayed; the published
      mean remains the price, and nothing is reweighted or fed into S31.2
      survival. First measurement 2026-08-15 against 2026-08-13, half-PPR
      12-team: 217 players matched across the two captures, 24 of them moved half
      a round or more, the largest being 12.3 picks.
    unanswered: >
      Whether recency weighting PREDICTS better -- S31.3's actual question -- is
      not answerable here. It needs a real draft to score against, which is what
      S76's audit trail supplies once one is recorded. Until then any weighted
      price would be an unvalidated claim about where a player will go, and S88
      forbids a prescriptive claim from a two-week analysis.
    limitation: >
      The delta is between two captures of a ROLLING WINDOW average, not two
      same-day prices: consecutive captures share most of their underlying
      drafts, so a delta is damped and successive deltas are not independent.
      Both source windows are recorded on every artifact.
    kill_rule: >
      If the archive holds one capture for a format, no movement is reported for
      it at all -- no glyph, no legend, and `available: false` with the reason.
      An interpolated or assumed move is worse than none: it would print a
      confident arrow at a draft table from data that does not exist.

  - id: cross_provider_projection_agreement
    question: >
      How far apart are two independent providers on the same player's season
      projection, and is that spread wide enough to change a pick (S38.1)?
    type: descriptive_construction
    blocks:
      - S83 draft-day sheet (whether a gap on the tier board is read as real)
      - S39 recommendation weighting
      - S56 fair-value adjustment
    decision_change: >
      Whether a drafter treats a gap on the tier board as a gap or as two boards
      disagreeing. S38.1's Use table: at a LOW-agreement player the thesis rests
      on the projection rather than on a research signal, so the drafter widens
      the price band and does not reach on the tier ordering alone. Every
      "research fair value" in this guide is a provider projection plus an
      adjustment, and until now the provider number carried no stated error at
      all.
    resolution_method: >
      A second provider captured on a GitHub Actions runner, where egress is open:
      `research snapshot --sources sleeper`, in its own workflow job running after
      the ADP capture has committed, so a provider outage cannot cost a day of
      price movement (S84). The manual-CSV path (S11 option 1B) stays available
      for any provider without an API. Both boards are scored by
      pipeline/scoring.py under the SAME league profile, which is what makes them
      comparable, then compared at a capture date both providers were archived on
      or before. Labelled by S38.1's own thresholds.
      research/foundations/provider_agreement.py.
    power_status: NOT_APPLICABLE   # a construction from two archives, not a test
    status: OPEN
    answered: >
      Nothing yet. The machinery is built and the second provider is not
      captured: with one provider archived the module reports `measurable: false`
      and the sheet renders exactly as it did before, which is the state to
      expect until an export lands.
    limitation: >
      Dispersion measures DISAGREEMENT, NOT ACCURACY (S38.1). Two providers can
      agree closely and both be wrong, particularly where they share upstream
      inputs -- and that clause is why the second provider is Sleeper rather than
      either candidate S11 names for manual import. FantasyPros' consensus, which
      this board is drawn from, aggregates CBS, ESPN, FFA, FFToday, FantasyPros,
      FantasySharks, NFL, NumberFire, RTSports and WalterFootball (component list
      read 2026-08-16). ESPN and FFToday are therefore inputs to the board's own
      number, and comparing an aggregate against one of its own components
      measures how far a contributor sits from a mean containing it -- smaller by
      construction, for a reason that has nothing to do with the players. That is
      an asserted property of published component lists, not a measured one: if
      Sleeper's payload names an upstream vendor inside that list, the choice has
      to be revisited (see `sleeper_projection_shape`).
      It is a floor on uncertainty, never a ceiling, and two is the
      smallest sample of opinions S38.1 contemplates. Replace it with measured
      projection error when a historical preseason projection archive exists
      (S66), as a new methodology version rather than a silent edit.
    kill_rule: >
      Three clauses, all refusals, because each of the states below computes
      cleanly and means something other than what it says.
      (1) NEVER average the providers into a consensus row (S38.1, S80). The
          spread IS the signal and a mean destroys it; the board's value metric
          is computed as if the second provider were absent, and a test asserts
          the board is identical with and without it.
      (2) If the second provider does not publish every stat the league profile
          scores, report NO agreement. pipeline/scoring.py fills an unpublished
          column with zero, so a provider omitting fumbles-lost scores high and
          one omitting receptions scores low -- arriving as a confident LOW
          against every player on the board, produced entirely by a column that
          was never published.
      (3) If the newest capture both providers share is more than seven days
          behind the board being priced, report NO agreement and say so on the
          page. A spread taken across two vintages measures the calendar rather
          than the providers. Same rule and same reason as adp_price_movement: a
          confident mark at a draft table from data that does not exist is worse
          than no mark.

  - id: sleeper_projection_shape
    question: >
      What does Sleeper's season projection payload actually look like -- its
      envelope, where identity lives, which stat columns it publishes, whether it
      carries a canonical id, and WHO COMPUTES IT?
    type: source_resolution
    blocks:
      - S38.1 cross-provider projection uncertainty
    decision_change: >
      Whether S38.1 reports anything at all. The adapter was written blind --
      api.sleeper.app answers 403 at CONNECT from the development sandbox, as FFC
      and FantasyPros do -- so host, path, envelope, identity container, name
      field and every stat column are guesses held in config/sources.yaml.
    resolution_method: >
      The first successful runner capture. pipeline/ingest/sleeper.py records
      `observed_row_keys`, `observed_stat_keys` and `observed_player_keys` into
      the snapshot manifest, which is committed -- so the answer lives in the
      archive rather than in a CI log that ages out. A wrong guess is corrected
      in YAML and re-parsed against the same stored bytes, because S84 keeps the
      payload unmodified.
    status: OPEN
    unanswered: >
      All of it. Five independent guesses: the host (api.sleeper.com or
      api.sleeper.app), the envelope (a bare list is assumed), whether identity
      sits flat on the row or under a nested `player` object, whether the name is
      `full_name` or first+last, and every stat column name.

      THREE ANSWERS MATTER MORE THAN THE REST.

      (1) Does the projection row carry `gsis_id`? Sleeper publishes it on the
      player objects in /v1/players/nfl, but the object embedded in a projection
      row may be slimmer. If it does, S12 resolution is an exact join and better
      than the FantasyPros path, which is name-matched. If it does not, the
      fallback is the same name match everything else here uses, and `sleeper_id`
      is already in player_ids.ROSTER_ID_COLUMNS as a third route worth wiring.

      (2) Does it publish its own scored total (`pts_half_ppr` and siblings)?
      That total is the only independent check that the stat map is RIGHT rather
      than merely non-empty -- the check that caught FantasyPros' `fumbles`
      column being fumbles LOST. Note it must be scored under SLEEPER's default
      rules, not the league's: Sleeper's published default prices an interception
      at -1 where this repository's BASE_RULES use -2.

      (3) WHO COMPUTES THE PROJECTION. If the payload names an upstream vendor,
      the independence argument behind choosing this provider is a claim about
      that vendor rather than about Sleeper. It survives a vendor outside
      FantasyPros' component list and does NOT survive one inside it, in which
      case the provider choice has to be revisited. Recorded here as a resolution
      criterion so it is checked rather than assumed.
    limitation: >
      Until the first capture lands, every value in the `sleeper_api` block of
      config/sources.yaml is a guess. The adapter is written so a wrong guess
      FAILS rather than emitting a frame of nulls: a null board reads downstream
      as a provider with no projections, and S19.3 would report itself blocked
      for a reason that is not true.

  - id: fantasypros_projection_shape
    question: >
      What does the FantasyPros public API actually return for season
      projections -- which path, which response envelope, and which column names
      -- and does the configured mapping in config/sources.yaml match it?
    type: source_resolution           # not a statistical question
    blocks:
      - S19.3 tiers and value over replacement
      - S19.4 opportunity cost
      - S83 draft-day sheet
    decision_change: >
      Nothing downstream chooses differently on the answer; the mapping either
      matches the payload or the adapter raises and names the keys it saw. It is
      registered because it is the one remaining unverified assumption between a
      configured key and a working tier board, and S31.1 showed what an
      unverified source assumption costs when it is discovered late.
    resolution_method: >
      Inspect the first archived payload from a runner call with the secret set:
      data/snapshots/<date>/fantasypros_projections_*.json. The adapter persists
      the raw bytes unmodified and records the row keys it observed in the
      snapshot manifest, so the answer comes from the archive rather than from a
      re-fetch that may return a different shape.
    status: RESOLVED
    resolved_on: 2026-08-13
    answer: >
      The envelope is {season, week, count, positions, scoring, players[...]}
      and `container_key: players` was right. Identity is flat on each row --
      fpid, name, team_id, position_id, all as configured -- but EVERY PROJECTED
      QUANTITY IS NESTED under a `stats` object, which the blind mapping did not
      anticipate: it read the stat columns off the row and would have found none
      of them.
      Three column names were wrong. `rec` is `rec_rec`. `fpts` is `points`,
      alongside `points_ppr` and `points_half` (the payload is served with
      scoring=STD and carries all three totals). And targets and games played are
      NOT PUBLISHED AT ALL -- there is no `rec_tgt` and no games column -- so both
      mappings were removed rather than aimed at a near-miss column.
      One name is a genuine ambiguity resolved by arithmetic: `fumbles` is priced
      at -2 in the provider's own published half-PPR total, which is the
      fumbles-LOST rate, so it is fumbles lost under a shorter name. Scoring the
      mapped frame under a half-PPR profile reproduces `points_half` to the cent,
      which is the check that the whole stat_map is right rather than merely
      non-empty.
      Row counts on the first capture: QB 83, RB 130, WR 189, TE 122.
    what_changed: >
      config/sources.yaml gained `stat_container_key: stats` and a corrected
      stat_map; pipeline/ingest/fantasypros.py gained `_stats()`, which reads the
      configured sub-object and falls back to the row when no container is
      configured, so a flat provider still parses. The adapter now records
      observed_stat_keys in the snapshot manifest as well as observed_row_keys --
      the row keys alone looked entirely correct and hid the whole problem.
      pipeline/features/schema.py gained fumbles_lost, two_point_conversions and
      special_teams_tds, which the payload carries and S13's whitelist rejected;
      omitting them would have dropped three scoring terms from every projected
      total.
    why_it_was_unresolved: >
      api.fantasypros.com answers 403 at CONNECT from the development sandbox --
      the same wall that put the ADP capture on a GitHub runner (S84) -- so the
      adapter could not be written against an observed payload the way
      pipeline/ingest/ffc_adp.py was. It was resolved the way this entry said it
      would be: from the first archived payload, on a runner, with the secret set.
    mitigation_outcome: >
      The mitigation worked and is worth recording as having worked. Every
      shape-dependent value was configuration rather than a literal in Python, so
      four wrong guesses cost four YAML edits and one small function. parse()
      raising and naming the keys it actually saw is what surfaced the nesting
      immediately; a frame of nulls would have been indistinguishable from a
      provider with no projections, and would have reached the tier board as a
      board of zeroes.
    note: >
      S11's canonical schema names two columns this repository deliberately
      spells differently. `pass_yards`/`rush_yards` are mapped to player_week's
      `passing_yards`/`rushing_yards` so pipeline/scoring.py prices a projection
      with the same code and profile it prices a real season with; and
      `fantasy_points` is mapped to `projected_fantasy_points` because the bare
      name is an outcome column meaning what actually happened. `projected_games`
      survives in the schema but is never populated from this provider, which
      does not publish games played.
    carried_limitation: >
      No targets column. S22.3 and anything else keyed on projected opportunity
      share cannot be built from this provider's board, and the tier metric is
      points-only in consequence.
